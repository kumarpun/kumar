name: E2E (Cypress on Vercel deploy)

# Runs Cypress against the Vercel deployment for this commit.
#
# Instead of listening for GitHub's deployment_status events (which only fire
# if Vercel's GitHub integration is configured to post them), this workflow
# queries Vercel's REST API directly using a VERCEL_TOKEN. It finds the
# deployment matching the pushed commit SHA, waits for it to reach READY,
# then runs Cypress against that URL.
#
# Required repo secrets (Settings → Secrets and variables → Actions → New repository secret):
#   VERCEL_TOKEN       — create at https://vercel.com/account/tokens (scope: full)
#   VERCEL_PROJECT_ID  — Vercel → Project → Settings → General → Project ID
#                         (prj_xxxxxxxxxxxxxxxxxx)
#
# GITHUB_TOKEN is NOT needed here — it was only used by the previous
# (GitHub-integration-based) action. GitHub injects GITHUB_TOKEN automatically
# into every workflow; you never configure it manually.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  cypress:
    name: Cypress against Vercel deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Vercel deployment (READY) matching this commit
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # For PRs, use the PR head SHA (what Vercel actually deploys);
          # for pushes, github.sha is the pushed commit.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::error::VERCEL_TOKEN and VERCEL_PROJECT_ID repo secrets must be set."
            exit 1
          fi

          echo "Looking for Vercel deployment for commit: $COMMIT_SHA"

          deadline=$((SECONDS + 600))  # 10 minute overall cap
          while [ $SECONDS -lt $deadline ]; do
            json=$(curl -sSf -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=20")

            match=$(echo "$json" | jq -c --arg sha "$COMMIT_SHA" \
              'first(.deployments[] | select(.meta.githubCommitSha == $sha))')

            if [ -n "$match" ] && [ "$match" != "null" ]; then
              state=$(echo "$match" | jq -r '.readyState // .state')
              target=$(echo "$match" | jq -r '.target // ""')
              immutable_url=$(echo "$match" | jq -r '.url')

              # For production deploys, prefer the shortest alias — that's the
              # clean public URL (e.g. kumar-ten.vercel.app). The .url field is
              # always the immutable per-deploy URL, which Vercel puts behind
              # SSO by default and returns 401 to Cypress.
              # For previews, fall back to the immutable URL (you'll need a
              # VERCEL_AUTOMATION_BYPASS_SECRET later if protection is on).
              if [ "$target" = "production" ]; then
                chosen=$(echo "$match" | jq -r '[.alias[]?] | sort_by(length) | .[0] // empty')
                url="https://${chosen:-$immutable_url}"
              else
                url="https://$immutable_url"
              fi

              echo "Vercel deployment for $COMMIT_SHA -> state=$state target=$target url=$url"
              case "$state" in
                READY)
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                ERROR|CANCELED)
                  echo "::error::Vercel deployment ended in state=$state. Cypress will not run."
                  exit 1
                  ;;
              esac
            else
              echo "No Vercel deployment for $COMMIT_SHA yet; waiting..."
            fi
            sleep 10
          done

          echo "::error::Timed out after 10m waiting for a READY Vercel deployment for $COMMIT_SHA."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          config: baseUrl=${{ steps.vercel.outputs.url }}

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7
